version: '3'

services:
  mysql:
    image: mysql:latest
    platform: linux/amd64
    environment:
      - MYSQL_DATABASE=connectf
      - MYSQL_USER=connectfuser
      - MYSQL_PASSWORD=connectfpwd
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      no_cache: true
      context: .
      dockerfile: ./dockerfiles/Dockerfile.backend
    environment:
      - IMPORT=$IMPORT
      - MYSQL_DOCKER_HOST=mysql
    command: gunicorn --reload --workers 3 --timeout 200 --bind 0.0.0.0:8001 -m 007 connectf.wsgi
    ports:
      - "8001:8001"
    depends_on: 
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
  
  import:
    build:
      no_cache: true
      context: .
      dockerfile: ./dockerfiles/Dockerfile.import
    environment:
      - IMPORT=$IMPORT
      - MYSQL_DOCKER_HOST=mysql
    command: sh /app/dockerfiles/import-data.sh
    depends_on: 
      mysql:
        condition: service_healthy
    volumes:
      - .:/app

  nginx:
    platform: linux/amd64
    build:
      context: .
      additional_contexts:
        connectf_react: ../connectf_react
      dockerfile: ./dockerfiles/Dockerfile.nginx
    ports:
      - "8080:8080"
    depends_on:
      - backend
volumes:
  db-data: